# Settings for the integration tests. The database comes from Testcontainers.
fleet.jwt.secret=test-secret-for-integration-tests-0123456789abcdef
fleet.jwt.token-prefix=Bearer
fleet.internal.api-key=test-internal-key
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# The evaluator is launched by hand in the tests, and the source clients are replaced by mocks
alerts.evaluation.enabled=false
