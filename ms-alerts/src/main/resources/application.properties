spring.application.name=ms-alerts
server.port=8088
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
management.endpoints.web.exposure.include=health

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/alerts_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:fleet}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_CONFIG_DDL:validate}
spring.jpa.show-sql=${JPA_CONFIG_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Security (JWT validation)
fleet.jwt.secret=${JWT_SECRET}
fleet.jwt.token-prefix=${JWT_TOKEN_TYPE:Bearer}

# Internal API KEY (accepted from other services and sent to the source services)
fleet.internal.api-key=${INTERNAL_API_KEY}

# Source services
fleet.services.vehicles.url=${VEHICLES_SERVICE_URL:http://localhost:8082}
fleet.services.drivers.url=${DRIVERS_SERVICE_URL:http://localhost:8083}
fleet.services.maintenance.url=${MAINTENANCE_SERVICE_URL:http://localhost:8086}
fleet.services.fuel.url=${FUEL_SERVICE_URL:http://localhost:8087}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
# One circuit breaker per source service (see ResilienceConfig)
spring.cloud.openfeign.circuitbreaker.enabled=true

# Scheduled evaluation of the rules
alerts.evaluation.enabled=${ALERTS_EVALUATION_ENABLED:true}
alerts.evaluation.interval-ms=${ALERTS_EVALUATION_INTERVAL_MS:900000}
alerts.evaluation.initial-delay-ms=${ALERTS_EVALUATION_INITIAL_DELAY_MS:60000}

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.api-docs.version=OPENAPI_3_0
