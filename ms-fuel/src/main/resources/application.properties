spring.application.name=ms-fuel
server.port=8087
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
management.endpoints.web.exposure.include=health

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fuel_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:fleet}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_CONFIG_DDL:validate}
spring.jpa.show-sql=${JPA_CONFIG_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Feign clients (ms-vehicles)
vehicles.service.url=${VEHICLES_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Circuit breaker (Resilience4j)
resilience4j.circuitbreaker.instances.vehicleClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.vehicleClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vehicleClient.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.vehicleClient.permitted-number-of-calls-in-half-open-state=3

# Security (JWT validation and internal calls)
fleet.jwt.secret=${JWT_SECRET}
fleet.jwt.token-prefix=${JWT_TOKEN_TYPE:Bearer}
internal.api-key=${INTERNAL_API_KEY}

# Demo data seeder (profile: demo)
fleet.demo.seed=${DEMO_SEED:42}
fleet.demo.days=${DEMO_DAYS:90}

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.api-docs.version=OPENAPI_3_0
