spring.application.name=ms-dashboard
server.port=8089
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
management.endpoints.web.exposure.include=health

# Security (JWT validation)
fleet.jwt.secret=${JWT_SECRET}
fleet.jwt.token-prefix=${JWT_TOKEN_TYPE:Bearer}

# Internal API KEY (sent to the source services)
fleet.internal.api-key=${INTERNAL_API_KEY}

# Source services
fleet.services.vehicles.url=${VEHICLES_SERVICE_URL:http://localhost:8082}
fleet.services.routes.url=${ROUTES_SERVICE_URL:http://localhost:8085}
fleet.services.fuel.url=${FUEL_SERVICE_URL:http://localhost:8087}
fleet.services.maintenance.url=${MAINTENANCE_SERVICE_URL:http://localhost:8086}
fleet.services.alerts.url=${ALERTS_SERVICE_URL:http://localhost:8088}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Response cache (Caffeine)
fleet.cache.ttl=${DASHBOARD_CACHE_TTL:60s}
fleet.cache.max-entries=${DASHBOARD_CACHE_MAX_ENTRIES:500}

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.api-docs.version=OPENAPI_3_0
