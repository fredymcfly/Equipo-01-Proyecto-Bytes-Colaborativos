spring.application.name=ms-gateway
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.api-docs.version=OPENAPI_3_0

# Gateway HTTP client timeouts
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

# Gateway Services
fleet.gateway.service.auth=${AUTH_SERVICE_URL}
fleet.gateway.service.alerts=${ALERTS_SERVICE_URL}
fleet.gateway.service.dashboard=${DASHBOARD_SERVICE_URL}
fleet.gateway.service.drivers=${DRIVERS_SERVICE_URL}
fleet.gateway.service.fuel=${FUEL_SERVICE_URL}
fleet.gateway.service.maintenance=${MAINTENANCE_SERVICE_URL}
fleet.gateway.service.routes=${ROUTES_SERVICE_URL}
fleet.gateway.service.vehicles=${VEHICLES_SERVICE_URL}

# Rate limiting (requests per minute and client IP)
fleet.gateway.rate-limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:60}