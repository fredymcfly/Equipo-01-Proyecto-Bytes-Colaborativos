spring.application.name=ms-gateway
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:true}
springdoc.api-docs.version=OPENAPI_3_0

# Rate limiting (requests per minute and client IP)
fleet.gateway.rate-limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:60}