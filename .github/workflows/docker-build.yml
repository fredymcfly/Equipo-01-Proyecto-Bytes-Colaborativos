name: Docker Build & Push

on:
  # Pull requests: only check that the images build (nothing is pushed)
  pull_request:
    branches: [dev, main]
  # Push to main: build and publish the images to GHCR
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: fleetcontrol-gateway
            context: ms-gateway
            description: API Gateway, single entry point that validates JWT and routes requests to the microservices.
          - name: fleetcontrol-auth
            context: ms-auth
            description: Auth service handling user authentication, roles and JWT tokens.
          - name: fleetcontrol-vehicles
            context: ms-vehicles
            description: Vehicles service managing the fleet vehicle catalog and their status.
          - name: fleetcontrol-drivers
            context: ms-drivers
            description: Drivers service managing driver profiles, licenses and availability.
          - name: fleetcontrol-routes
            context: ms-routes
            description: Routes service managing route planning and assignment of vehicles and drivers.
          - name: fleetcontrol-maintenance
            context: ms-maintenance
            description: Maintenance service tracking vehicle maintenance orders and schedules.
          - name: fleetcontrol-fuel
            context: ms-fuel
            description: Fuel service recording fuel consumption and costs per vehicle.
          - name: fleetcontrol-alerts
            context: ms-alerts
            description: Alerts service evaluating fleet rules and generating alerts.
          - name: fleetcontrol-dashboard
            context: ms-dashboard
            description: Dashboard service aggregating fleet metrics from the other services.

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from pom.xml
        id: vars
        working-directory: ${{ matrix.service.context }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from pom.xml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.service.name }}:${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            IMAGE_DESCRIPTION=${{ matrix.service.description }}
