name: Microservices Code Quality

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ms-gateway
          - ms-auth
          - ms-vehicles
          - ms-drivers
          - ms-routes
          - ms-maintenance
          - ms-fuel
          - ms-alerts
          - ms-dashboard

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Spotless — check format
        run: mvn -B spotless:check

      - name: Checkstyle — check style
        run: mvn -B checkstyle:check

      - name: PMD — check for code issues
        run: mvn -B pmd:check
